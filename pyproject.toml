[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "luanma"
version = "0.1.0"
description = "Fix mojibake filenames in zip archives: auto-detect GBK/Big5/Shift-JIS/EUC-KR, preview, safely extract, or rewrite to UTF-8 | 压缩包乱码文件名自动检测、修复与安全解压工具"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "hc-ui" }]
keywords = [
    "zip",
    "mojibake",
    "encoding",
    "gbk",
    "big5",
    "shift-jis",
    "luanma",
    "乱码",
    "unzip",
    "filename",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Compression",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/hc-ui/luanma"
Repository = "https://github.com/hc-ui/luanma"
Issues = "https://github.com/hc-ui/luanma/issues"
Changelog = "https://github.com/hc-ui/luanma/blob/main/CHANGELOG.md"

[project.scripts]
luanma = "luanma.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
